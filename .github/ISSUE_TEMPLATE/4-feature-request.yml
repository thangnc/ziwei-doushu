name: Feature request / 功能建议
description: A new feature or an improvement you'd like
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it working
  - type: textarea
    id: source
    attributes:
      label: Source (required when it touches a charting convention)
      description: Which book or lecture, or which setting in which charting software. Changes to a convention without a source are generally not accepted.
