name: CodeQL

# Static analysis of the TypeScript app and of these workflows. This advanced setup conflicts with
# GitHub's CodeQL "default setup": keep default setup off in the repository's security settings.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

# Only superseded PR runs are cancelled; scans of main and scheduled scans always finish.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Data, not code: quoted classical text, the generated brightness tables and the
          # compressed baseline fixtures.
          config: |
            paths-ignore:
              - docs/tianji-ziwei
              - packages/ziwei-engine/src/school-tables.generated.ts
              - packages/ziwei-engine/test/fixtures/*.gz
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
