name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so an advisory published against an unchanged lockfile still surfaces.
    - cron: '23 4 * * 1'
  workflow_dispatch:

# See ci.yml: only superseded PR runs are cancelled.
concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Blocks a PR that adds or upgrades to a dependency with a known high or critical advisory.
  # It compares the PR's manifests with the base branch, so it runs on PRs only.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Audits the whole locked production tree, including advisories against dependencies that are
  # already on main. Dev dependencies are excluded: they never reach the browser bundle.
  npm-audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # npm audit reads package-lock.json only; it doesn't depend on ICU or tzdata, so the
      # canonical container isn't needed. .nvmrc still pins the exact Node and npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
