name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck + chart regression
    runs-on: ubuntu-latest
    # Canonical environment: identical to the one the baseline fixtures are generated in
    # (Node 24.22.2 / npm 11.19.1, linux/amd64; ICU and tzdata are recorded in the fixture metadata).
    # Pinned by digest so a floating node-version '24' can't drift to a new patch with different ICU / tzdata.
    # Versions and the procedure for changing them: scripts/regression/fixtures/README.md. .nvmrc matches for local development.
    container:
      image: node:24.22.2-bookworm@sha256:6b9d4ea31e614e29f364bf75758458731eb1e105b80c99667438dd6b3fe262e0
    steps:
      - uses: actions/checkout@v4

      # The container runs as root but the checked-out workspace belongs to the runner user, so git reports
      # "dubious ownership". The neutral-naming test calls git ls-files, so mark the workspace as safe.
      - name: Mark workspace as a git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # package-lock.json is committed: install the locked versions.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Chart engine regression
        run: npm test

      - name: Build
        run: npm run build
