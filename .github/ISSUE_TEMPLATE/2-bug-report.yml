name: Bug report / 程序问题
description: The code won't run, throws an error, or a page displays incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        First check: the open-source version **does not include** any `/api/*` backend route (AI interpretation, compatibility analysis). A 404 from those features is expected; you'd need to implement them yourself (see "Quick start" in the README). Charting itself needs no API key.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm ci
        2. npm run dev
        3. Open /chart, choose … and click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result (error message, screenshot)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "e.g. macOS 15 / Node 24 / Chrome 140"
