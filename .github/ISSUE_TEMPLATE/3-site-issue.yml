name: ouranic.cn issue / 正式站问题
description: Problems with the live site (ouranic.cn), such as login, payment or display
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: URL of the affected page
      placeholder: https://ouranic.cn/…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How it happened
      placeholder: What you clicked or entered, and what error you saw
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: "e.g. Windows 11 / Chrome 153 / behind a corporate proxy"
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Please don't include phone numbers, verification codes, other people's birth data or other private information.
