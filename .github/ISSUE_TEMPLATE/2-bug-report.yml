name: Bug report / 程序问题
description: The code won't run, throws an error, or a page displays incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        First check: the open-source version **does not include** any `/api/*` backend route (AI interpretation, compatibility analysis). A 404 from those features is expected; you'd need to implement them yourself (see "What is not included" in the README). Charting itself needs no API key.

        If a chart looks wrong but nothing errors, use the **Chart result question** form instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: This isn't the expected 404 from an `/api/*` route.
          required: true
        - label: Screenshots and logs contain no keys, tokens or anyone else's birth data.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Chart engine (packages/ziwei-engine)
        - Birth form / true solar time / 时辰
        - Chart board / palace cells
        - Time navigation (大限 / 流年)
        - 合盘 (/heming)
        - Library (/library)
        - Knowledge (/knowledge)
        - Localization (Vietnamese / Chinese UI)
        - Build / install / CI
        - Other
    validations:
      required: true
  - type: dropdown
    id: run
    attributes:
      label: How you ran it
      options:
        - npm run dev
        - npm run build && npm run start
        - Regression tests (npm test)
        - My own deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm ci
        2. npm run dev
        3. Open /chart, choose … and click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, console output or error log
      description: Required. Drop a screenshot or recording for anything visual. When there's nothing to see, paste the terminal or browser console output inside a ``` code block.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "e.g. macOS 15 / Node 24.22.2 / Chrome 140"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: "Output of git rev-parse --short HEAD."
      placeholder: "e.g. 1e33b76"
