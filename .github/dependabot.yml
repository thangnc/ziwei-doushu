version: 2
updates:
  # Workflow actions are pinned to commit SHAs (see ci.yml). Dependabot keeps the SHA and its
  # version comment current. One grouped PR per week instead of one per action.
  # Dependabot does not update the `container: image:` digest in ci.yml; that image is the
  # canonical baseline environment and changes only by the procedure in
  # scripts/regression/fixtures/README.md.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Security updates only, on purpose. open-pull-requests-limit caps VERSION updates only;
  # security-update PRs have their own budget, so 0 switches off routine bumps while advisory
  # fixes still arrive, grouped into one PR.
  # A bump to iztro or lunar-javascript can change chart output: it needs the baselines
  # regenerated in the canonical container and reviewed like any engine change
  # (scripts/regression/fixtures/README.md, rule 4). `npm test` fails on such a PR until then.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
